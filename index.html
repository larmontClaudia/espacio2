<html>
<head>
  <meta charset="utf-8">
  <title>Espacio 2 - Sala y Cuadros</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Fondo café pastel y piso rosa coral -->
    <a-sky color="#E6D5C3"></a-sky>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="12" height="12" color="#E38582"></a-plane>

    <!-- Modelado propio: sofá -->
    <a-entity gltf-model="sofá.glb" position="0 0 -3.8" rotation="0 0 0" scale="1 1 1"></a-entity>

    <!-- Cuadrados/cuadros azules al fondo estilo sala -->
    <a-box position="-2.3 1.9 -5.8" width="1.1" height="1.1" depth="0.08" color="#4A90E2"></a-box>
    <a-box position="-0.8 2.2 -5.8" width="1.2" height="0.95" depth="0.08" color="#357ABD"></a-box>
    <a-box position="0.8 1.85 -5.8" width="1.1" height="1.1" depth="0.08" color="#4A90E2"></a-box>
    <a-box position="2.3 2.15 -5.8" width="1" height="1" depth="0.08" color="#5CA4E8"></a-box>
  </a-scene>
</body>
</html>
